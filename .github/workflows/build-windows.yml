name: Build Windows exe

on:
  push:
    branches: [main, ghostscript]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract OCR (for scanned PDF to Excel)
        run: |
          choco install tesseract --no-progress -y
          # Stage just the files we bundle: the exe, its DLLs, and English data.
          $src = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force -Path tessbundle\tessdata | Out-Null
          Copy-Item "$src\*.exe" tessbundle\ -Force
          Copy-Item "$src\*.dll" tessbundle\ -Force
          Copy-Item "$src\tessdata\eng.traineddata" tessbundle\tessdata\ -Force
          Copy-Item "$src\tessdata\osd.traineddata" tessbundle\tessdata\ -Force

      - name: Install Ghostscript (for high-quality PDF compression)
        run: |
          choco install ghostscript --no-progress -y
          # Find the versioned install directory (e.g. gs10.04.0)
          $gsRoot = Get-ChildItem "C:\Program Files\gs" | Sort-Object Name -Descending | Select-Object -First 1
          $gsPath = $gsRoot.FullName
          Write-Host "Ghostscript at: $gsPath"
          # Bundle exe, core DLL, init scripts, and essential resources.
          # We skip Resource\Font (PDFs already embed their fonts) to save ~10MB.
          New-Item -ItemType Directory -Force -Path gsbundle\lib | Out-Null
          New-Item -ItemType Directory -Force -Path gsbundle\Resource | Out-Null
          Copy-Item "$gsPath\bin\gswin64c.exe" gsbundle\ -Force
          Copy-Item "$gsPath\bin\gsdll64.dll"  gsbundle\ -Force
          Copy-Item "$gsPath\lib\*"             gsbundle\lib\ -Force -Recurse
          # Copy Resource subdirs except Font
          Get-ChildItem "$gsPath\Resource" -Directory |
            Where-Object { $_.Name -ne "Font" } |
            ForEach-Object {
              Copy-Item $_.FullName "gsbundle\Resource\$($_.Name)" -Recurse -Force
            }

      - name: Build with PyInstaller
        run: |
          pyinstaller --onedir --windowed --name "PJS Pdf Studio" --add-data "ui;ui" `
            --add-data "tessbundle;tesseract" `
            --add-data "gsbundle;ghostscript" `
            --collect-submodules core `
            --collect-all pdfminer `
            --hidden-import win32timezone `
            --collect-all winocr `
            --collect-all winsdk `
            --hidden-import pywebview.platforms.edgechromium `
            main.py

      # onedir instead of onefile: the app ships as a folder (exe + its files)
      # so there is no per-launch self-extraction, which is what made the first
      # open slow (it grew worse once Tesseract was bundled). Keep the exe
      # inside its folder and run it from there (a desktop shortcut is fine).
      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: PJS-Pdf-Studio-windows
          path: "dist/PJS Pdf Studio"
          retention-days: 30
